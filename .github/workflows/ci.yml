name: CI

on:
  push:
    branches: [development, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # `postinstall` runs `prisma generate`, which needs a syntactically valid
  # DATABASE_URL but never connects. Nothing in CI talks to a database.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
  # Node 24: the local toolchain and `@types/node@^24` both target it, and
  # Vitest 5 requires Node 22.12 or newer.
  NODE_VERSION: "24"

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Audit production dependencies (non-blocking until spec 44)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      LIVEBLOCKS_SECRET_KEY: ${{ secrets.LIVEBLOCKS_SECRET_KEY }}
    steps:
      - name: Check for build secrets
        id: secrets
        run: |
          missing=""
          for name in NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY CLERK_SECRET_KEY LIVEBLOCKS_SECRET_KEY; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::notice title=Build skipped::Repository secrets not set:$missing. Add them under Settings → Secrets and variables → Actions to run the build."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.available == 'true'
        uses: actions/checkout@v7
      - if: steps.secrets.outputs.available == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - if: steps.secrets.outputs.available == 'true'
        run: npm ci
      - if: steps.secrets.outputs.available == 'true'
        run: npm run build
